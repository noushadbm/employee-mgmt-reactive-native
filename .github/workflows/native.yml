name: build-native
on:
  workflow_dispatch:      # manual run from the Actions tab
  # push:
  #   branches: [main]    # uncomment to build on every push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # New Step: Dynamically extract the artifactId from pom.xml
      - name: Extract Project Name from Maven pom.xml
        id: maven-project
        uses: andreacomo/maven-gav-extractor@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Replaced hardcoded text with the dynamic output variable:
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.maven-project.outputs.artifact-id }}:native
